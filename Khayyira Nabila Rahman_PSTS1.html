<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Creativity Festival</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-red-700 text-white py-6 shadow-md">
        <div class="max-w-5xl mx-auto px-40">
            <h1 class="text-1xl font-bold">Student Creativity Festival</h1>
            <p class="mt-1 text-red-100">
                Showcase Your Creativity, Skills and Inonvative Ideas
            </p>
        </div>
    </header>
    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-6 py-10">

        <div class="bg-white rounded-xl shadow-lg p-6 md:p-8">

            <h2 class="text-2xl font-bold text-gray-800 mb-2">
                Registration Form
            </h2>

            <p class="text-gray-500 mb-8">
                Please fill in the information below to make a registration.
            </p>

            <div class="space-y-6">

                <!-- Student Name -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Student Name
                    </label>
                    <input
                        type="text"
                        placeholder="Enter your full name"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-blue-500
                               focus:border-blue-500"
                        required
                    >
                </div>

                <!-- Class -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Class
                    </label>

                    <select
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               bg-white focus:outline-none focus:ring-2
                               focus:ring-blue-500"
                        required
                    >
                        <option value="">Select a Class</option>
                        <option value="X">X</option>
                        <option value="XI">XI</option>
                        <option value="XI">XII</option>
                    </select>
                </div>

                <!-- Gender -->
                 <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-3 ">
                        Gender
                    </label>

                    <div class="flex flex-col sm:flex-row gap-4">
                        <label class="flex items-center gap-2">
                            <input
                                type="radio"
                                name="Gender"
                                value="Male"
                                class="w-4 h-4 text-blue-600"
                            >
                            <span>Male</span>
                        </label>

                        <label class="flex items-center gap-2">
                            <input
                                type="radio"
                                name="Gender"
                                value="Female"
                                class="w-4 h-4 text-blue-600"
                            >
                            <span>Female</span>
                        </label>
                   </div>
                </div>

                   <!-- Competition Category -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2 ">
                        Competition Category
                    </label>

                    <select
                        class="w-full px-7 py-3 border border-gray-300 rounded-lg
                               bg-white focus:outline-none focus:ring-2
                               focus:ring-blue-500"
                        required
                    >
                        <option value="">Select a Category</option>
                        <option value="X">Web Development</option>
                        <option value="XI">IoT Project</option>
                        <option value="XI">Graphic Design</option>
                        <option value="XI">Public Speaking</option>
                        <option value="XI">Photography</option>
                    </select>
                </div>
            </div>

                <!-- Participation Type -->
                 <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-3 mt-1">
                        Participation Type
                    </label>

                    <div class="flex flex-col sm:flex-row gap-4">
                        <label class="flex items-center gap-2">
                            <input
                                type="radio"
                                name="Participation Type"
                                value="Individual"
                                class="w-4 h-4 text-blue-600"
                            >
                            <span>Individual</span>
                        </label>

                        <label class="flex items-center gap-2">
                            <input
                                type="radio"
                                name="Participation Type"
                                value="Team"
                                class="w-4 h-4 text-blue-600"
                            >
                            <span>Team</span>
                        </label>

                </div> 

                <!-- Team's Name -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Team's Name
                    </label>
                    <input
                        type="text"
                        placeholder="Enter your team's name"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-blue-500
                               focus:border-blue-500"
                        required
                    >
                </div>
                
                <!-- Contact Number -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                       Contact Number
                    </label>
                    <input
                        type="text"
                        placeholder="08xxxxxxxx"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-blue-500
                               focus:border-blue-500"
                        required
                    >
                </div>
                
                <!-- Project Description -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Project Description
                    </label>

                    <textarea
                        rows="4"
                        placeholder="Describe your project or competition entry..."
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-blue-500
                               resize-none"
                    ></textarea>
                </div>

                <!-- Submit Button -->
                <div class="pt-4">
                    <button
                        type="submit"
                        class="w-full bg-red-600 text-white font-semibold
                               py-3 px-6 rounded-lg
                               hover:bg-red-800
                               transition duration-300
                               shadow-md hover:shadow-lg"
                    >
                        Register Now
                    </button>
                </div>

            </form>

        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-gray-500 text-sm py-6">
        © 2026 Registration System
    </footer>

</body>
</html>
